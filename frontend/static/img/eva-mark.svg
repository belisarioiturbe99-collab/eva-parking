<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 108" fill="none">
  <defs>
    <linearGradient id="evaGoldBorder" x1="12" y1="8" x2="88" y2="88" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#D99B08"/>
      <stop offset="35%" stop-color="#F6BE18"/>
      <stop offset="72%" stop-color="#8A5E06"/>
      <stop offset="100%" stop-color="#231905"/>
    </linearGradient>
    <linearGradient id="evaGoldP" x1="30" y1="28" x2="72" y2="66" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#DDA00A"/>
      <stop offset="45%" stop-color="#F4BC1C"/>
      <stop offset="100%" stop-color="#6B4A06"/>
    </linearGradient>
    <linearGradient id="evaPinTip" x1="50" y1="86" x2="50" y2="103" gradientUnits="userSpaceOnUse">
